name: Publish

on:
  push:
    tags:
      - "core@*"
      - "plugins@*"
      - "react@*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno test -A core plugins react

  publish-core:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/core@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: core
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm core
      - run: npm publish --provenance --access public
        working-directory: core/npm

  publish-plugins:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/plugins@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: plugins
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm plugins
      - run: npm publish --provenance --access public
        working-directory: plugins/npm

  publish-react:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/react@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: react
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm react
      - run: npm publish --provenance --access public
        working-directory: react/npm
