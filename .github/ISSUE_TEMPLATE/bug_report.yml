name: Bug report
description: Something isn't working the way the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please include a minimal reproduction:
        a small repo, StackBlitz/CodeSandbox link, or a self-contained code
        snippet. Bugs without a reproduction are much harder to fix quickly.

  - type: input
    id: package
    attributes:
      label: Package and version
      description: Which package and version are you using?
      placeholder: "@kin-store/core@0.3.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal repro (repo link, sandbox link, or code snippet).
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Runtime and version (Deno, Node, browser), and framework version if relevant.
      placeholder: "Deno 2.x / Node 22 / Chrome 130, React 19"
    validations:
      required: false
